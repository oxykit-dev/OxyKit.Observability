name: Release NuGet

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate version matches projects
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          for proj in \
            src/OxyKit.Observability/OxyKit.Observability.csproj \
            src/OxyKit.OpenTelemetry/OxyKit.OpenTelemetry.csproj
          do
            PROJECT_VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$proj" | head -1)
            if [ "$PROJECT_VERSION" != "$VERSION" ]; then
              echo "::error::Tag version ($VERSION) does not match $proj ($PROJECT_VERSION)"
              exit 1
            fi
          done

      - name: Restore
        run: dotnet restore OxyKit.Observability.slnx

      - name: Build
        run: dotnet build OxyKit.Observability.slnx --no-restore -c Release

      - name: Test
        run: |
          dotnet test tests/OxyKit.Observability.Tests/OxyKit.Observability.Tests.csproj -c Release --no-restore --verbosity normal

      - name: Pack Observability + OpenTelemetry
        run: |
          mkdir -p artifacts
          dotnet pack src/OxyKit.Observability/OxyKit.Observability.csproj -c Release --no-build -o ./artifacts
          dotnet pack src/OxyKit.OpenTelemetry/OxyKit.OpenTelemetry.csproj -c Release --no-build -o ./artifacts

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages to nuget.org
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Zip NuGet packages
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          NUGET_ZIP="OxyKit.Observability-${VERSION}-nuget.zip"
          (cd artifacts && zip -r "../${NUGET_ZIP}" .)
          echo "NUGET_ZIP=${NUGET_ZIP}" >> "$GITHUB_ENV"

      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            ${{ env.NUGET_ZIP }}
            artifacts/*.nupkg
            artifacts/*.snupkg
